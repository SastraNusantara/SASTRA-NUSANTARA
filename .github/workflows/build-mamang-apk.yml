name: Build Mamang Billing APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MamangBilling-Android-Project-v1.2.1-GitHubBuild.zip'
      - '.github/workflows/build-mamang-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q MamangBilling-Android-Project-v1.2.1-GitHubBuild.zip -d extracted
          echo "PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle | head -1)")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MamangBilling-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
      - name: Enable AndroidX
        run: |
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> "$PROJECT_DIR/gradle.properties"
